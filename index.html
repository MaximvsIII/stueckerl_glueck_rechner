<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120C09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=33" />
  <title>Jasmins Stückerl Glück</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Jasmins Stückerl Glück</p>
        <h1>Calcolatore Torte</h1>
      </div>
    </header>

    <main class="main-content">
      <section id="home-view" class="view active">
        <div class="hero-card">
          <h2>🧁 Benvenuto in Pasticceria</h2>
          <button id="new-cake-home" class="btn btn-primary btn-main">
            <span>+</span> NUOVO PROGETTO TORTA
          </button>
        </div>

        <div class="section-block">
          <div class="section-title-row">
            <h3>ULTIME CREAZIONI</h3>
          </div>
          <div id="latest-cakes-list" class="card-list"></div>
        </div>
      </section>

      <section id="cakes-view" class="view">
        <div class="section-title-row">
          <h3>Archivio Torte</h3>
          <button id="new-cake-cakes" class="btn btn-primary" style="width:auto; padding:8px 15px;">+</button>
        </div>
        <div id="cakes-list" class="card-list"></div>
      </section>

      <section id="ingredients-view" class="view">
        <div class="section-title-row">
          <h3>Dispensa Ingredienti</h3>
          <button id="new-ingredient-btn" class="btn btn-primary" style="width:auto; padding:8px 15px;">+</button>
        </div>
        <div id="ingredients-list" class="card-list"></div>
      </section>

      <section id="settings-view" class="view">
        <div class="section-block">
          <div class="section-title-row">
            <h3>Configurazione</h3>
          </div>
          <div id="settings-content" class="settings-panel"></div>
        </div>
      </section>

      <section id="cake-detail-view" class="view">
        <div class="section-title-row">
          <button id="back-to-cakes" class="btn btn-ghost" style="width:auto;">← Torna all'elenco</button>
        </div>
        <div id="cake-detail-content" class="cake-detail"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button class="nav-item active" data-view="home-view">
        <span>🏠</span>
        <small>Home</small>
      </button>
      <button class="nav-item" data-view="cakes-view">
        <span>🎂</span>
        <small>Torte</small>
      </button>
      <button class="nav-item" data-view="ingredients-view">
        <span>🥣</span>
        <small>Dispensa</small>
      </button>
      <button class="nav-item" data-view="settings-view">
        <span>⚙️</span>
        <small>Impostazioni</small>
      </button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="close-modal" class="btn btn-ghost close-btn">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="db.js?v=33"></script>
  <script src="app.js?v=33"></script>
</body>
</html>
